version: '3.8'

services:
  # 1. Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: atendia-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-atendia}
      TZ: America/El_Salvador
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atendia-net

  # 2. Servidor Web Next.js (Dashboard, Chat Web, API)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atendia-web
    restart: always
    command: sh -c "npx prisma db push && npm run prisma:seed && npm run start"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-atendia}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@demo.daniautoma.cloud}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234password}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TZ: America/El_Salvador
    depends_on:
      - postgres
    expose:
      - "3000"
    networks:
      - atendia-net
      - dokploy-network

  # 3. Worker de fondo (WhatsApp Baileys, Debounce 8s, Tareas programadas)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atendia-worker
    user: root
    restart: always
    command: npm run start:worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-atendia}
      APP_URL: ${APP_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      WHATSAPP_SESSION_DIR: /app/whatsapp-session
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TZ: America/El_Salvador
    depends_on:
      - postgres
      - web
    volumes:
      - whatsapp_session:/app/whatsapp-session
    networks:
      - atendia-net

volumes:
  postgres_data:
    driver: local
  whatsapp_session:
    driver: local

networks:
  atendia-net:
    driver: bridge
  dokploy-network:
    external: true

